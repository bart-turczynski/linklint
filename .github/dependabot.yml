# NOT RUNNING. The GitHub account is suspended (the API returns 403 on every
# call), so nothing here is in effect and no PR described below will arrive.
# CI moved to GitLab in LINK-yrbwwyrj; this file is kept, unedited apart from
# this notice, so the configuration survives if the account is restored.
#
# The data-pin half of that job now has a replacement (LINK-rlrdiqhm):
#
#     pnpm data:upstream-check
#
# asks the npm registry whether any `<name>@<version>` stamp in DATA_VERSIONS
# has moved, and exits non-zero when one has. It is a manual/scheduled command,
# never part of the pre-push gate, because `tools/verify.sh` has to work
# offline. So the reasoning below still governs — these PRs were the only
# automatic signal that the bundled Public Suffix List moved — but the signal it
# describes now comes from that command instead of from this file.
#
# Still unserved while the account is suspended: dev-dependency bumps and the
# GitHub Actions group. Those are ordinary upgrades, not trust-boundary data,
# so they wait for the account rather than getting a replacement mechanism.
version: 2
updates:
  # Group all GitHub Actions bumps into a single weekly PR to limit noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # npm, across the pnpm workspace.
  #
  # `tldts` and `tr46` are deliberately NOT grouped and NOT auto-mergeable: they
  # carry the Public Suffix List and the UTS-46/Unicode tables that linklint's
  # verdicts are computed from, so a patch bump can silently redraw a
  # registrable-domain boundary. Each gets its own PR and the review procedure
  # in CONTRIBUTING.md ("Bumping the tldts or tr46 pin").
  #
  # Their PRs arrive RED, by design: dependabot moves the pin but not the
  # version stamps, and data-versions.test.ts fails on the mismatch. Do not
  # merge one and do not repair its CI — run the procedure on a branch, land
  # that, close the PR as superseded.
  #
  # There is deliberately NO `ignore:` entry for them. linklint never contacts
  # publicsuffix.org, and the PSL provenance date is a packaging proxy that can
  # prove staleness but never freshness, so `pslOutdated()` reads "undetermined"
  # inside its window. These PRs are the only automatic signal that the bundled
  # data moved; silencing them would trade a tidier PR list for the one
  # mechanism that surfaces a silently ageing trust boundary.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        exclude-patterns: ["tldts", "tr46"]
