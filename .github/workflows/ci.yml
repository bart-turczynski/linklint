name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Needed to re-verify main without an empty commit — for
  # example after an outage that prevented jobs from starting, which leaves the
  # README badge stale with no code change available to refresh it.
  workflow_dispatch:

jobs:
  verify:
    name: build + typecheck + test + features (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both entries must pass. 24 is the floor declared by engines.node in
      # every package; 26 is the current release line, and engines has no upper
      # bound, so users install on it. Nothing is known to differ between them —
      # the gate has been measured byte-identical on both (LINK-wpaieeen) — and
      # the matrix exists to keep it that way, not to chase a known break.
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify gate
        run: pnpm check
