name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Needed to re-verify main without an empty commit — for
  # example after an outage that prevented jobs from starting, which leaves the
  # README badge stale with no code change available to refresh it.
  workflow_dispatch:

jobs:
  verify:
    name: build + typecheck + test + features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify gate
        run: pnpm check
