repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Vendored upstream snapshots are committed BYTE-FOR-BYTE so their pinned
      # sha256 can be re-verified against the publisher with a plain `shasum`.
      # These two hooks rewrite content (IdnaTestV2.txt carries trailing
      # whitespace on 7 lines, confusables.txt on 4,654), which would silently
      # break that pin — the same class of hazard as the mixed-line-ending
      # incident on the IANA CSVs.
      - id: end-of-file-fixer
        exclude: '^(packages/core/test|tools)/data/'
      - id: trailing-whitespace
        exclude: '^(packages/core/test|tools)/data/'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
      - id: check-case-conflict
  # Secret scanning — the project's ONLY secret scanner (LINK-tmqonltz). It runs
  # at commit time rather than as a GitLab pipeline job because most pushes
  # here create no pipeline, and GitLab push protection is Ultimate-only.
  # Scans staged changes; project allowlist lives in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # The verify gate. This is the PRIMARY gate, not a mirror of a remote one:
      # GitLab's shared runners are metered, so .gitlab-ci.yml only builds on
      # dependency/toolchain/pinned-data changes and every other push is gated
      # here. tools/verify.sh runs `pnpm check` across the whole Node matrix
      # plus a --frozen-lockfile install, which is what a warm local
      # node_modules would otherwise hide.
      - id: verify
        name: verify (full Node matrix — the gate)
        entry: tools/verify.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
