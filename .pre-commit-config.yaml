repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Vendored upstream snapshots are committed BYTE-FOR-BYTE so their pinned
      # sha256 can be re-verified against the publisher with a plain `shasum`.
      # These two hooks rewrite content (IdnaTestV2.txt carries trailing
      # whitespace on 7 lines, confusables.txt on 4,654), which would silently
      # break that pin — the same class of hazard as the mixed-line-ending
      # incident on the IANA CSVs.
      - id: end-of-file-fixer
        exclude: '^(packages/core/test|tools)/data/'
      - id: trailing-whitespace
        exclude: '^(packages/core/test|tools)/data/'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: verify
        name: verify (mirrors CI)
        entry: bash -c "pnpm check"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
