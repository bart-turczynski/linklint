# Remote half of the verify gate (LINK-yrbwwyrj).
#
# The gate itself is `pnpm check` (build + typecheck + test + features) across
# the Node matrix, and it runs LOCALLY on every push via the pre-push hook —
# `tools/verify.sh` covers both majors on this machine, so the ordinary case
# needs no runner at all.
#
# GitLab's shared runners are metered, so this file is deliberately quiet: the
# `workflow:rules` below mean most pushes create NO PIPELINE, not a pipeline
# that skips its jobs. A skipped job still costs a runner slot; an uncreated
# pipeline costs nothing.
#
# What is left running remotely is the change class the local gate is weakest
# on — dependency, toolchain and pinned-data movement. That is where an
# independent machine and a genuinely clean install earn their minutes:
# `tools/verify.sh` reuses a warm store and the Node builds this laptop happens
# to have, while these jobs resolve from the lockfile on stock images.
#
# The dependency audit (`pnpm audit:deps`) is NOT scheduled here. The project
# runs no scheduled pipelines (LINK-txxcwplc, declined): the audit is run by hand
# before every release and after dependency changes — CONTRIBUTING.md,
# §"Auditing dependencies for known vulnerabilities".
#
# To force a run at any time: CI/CD -> Pipelines -> "Run pipeline" (the `web`
# source below always builds).
#
# STATUS, 2026-09-23: the namespace's shared-runner minutes are EXHAUSTED again.
# Every pipeline since 2026-09-23 10:15 UTC failed `ci_quota_exceeded` before any
# job started (e.g. 2874608846 on `main`). The allowance resets on 2026-10-01;
# the v0.1.0 tag waits for that, because trusted publishing runs only on
# GitLab.com hosted runners (LINK-rdkfkqze). `tools/verify.sh` remains the gate.
#
# STATUS, 2026-09-05: remote verification worked again. From 2026-08 it did not —
# shared-runner minutes for this namespace were exhausted and every job failed to
# start with `ci_quota_exceeded` — and making the project public restored the
# allowance without a self-hosted runner (LINK-ozgkfjow). Pipeline 2822652495 put
# both matrix legs on shared runners.
#
# It is also GREEN, as of pipeline 2822716357 on `main` — both matrix legs
# succeeded. The first real run was not: both legs failed `script_failure`
# against a tree `tools/verify.sh` passes on both majors, because the runner is
# Linux and runs as ROOT, which silently defeats any test that proves a fail-open
# by making a file unwritable (LINK-ujbttpph, fixed in 7ecba8b).
#
# What survives that fix is the reading rule it taught. The habit that grew
# during the outage — a red pipeline means the quota, not the tree — is WRONG;
# check `failure_reason` first, and note that it now distinguishes three things
# rather than two: `ci_quota_exceeded` is the quota, `script_failure` is the
# tree, and a `script_failure` the local gate cannot reproduce is the runner
# differing from the workstation — Linux rather than macOS, and root rather than
# a user.

stages: [verify, publish]

variables:
  # Keep the pnpm store inside the project so GitLab's cache can carry it
  # between runs; a cold store is most of the wall time of these jobs.
  PNPM_STORE: "$CI_PROJECT_DIR/.pnpm-store"

workflow:
  # Supersede a running pipeline when a newer commit lands on the same ref
  # rather than paying for both.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Always: explicitly requested from the UI or the API.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    # `api` belongs in this arm for the same reason the three above do — it is
    # someone asking on purpose (`POST /projects/:id/pipeline`). It was missing,
    # which made the quota question unanswerable from the CLI: the request came
    # back "The pipeline did not run. Review the workflow:rules configuration"
    # and no pipeline was created, so there was no `failure_reason` to read.
    - if: $CI_PIPELINE_SOURCE == "api"
    # Always: release tags. The one moment the artifact leaves this machine.
    - if: $CI_COMMIT_TAG
    # Otherwise only when dependencies, the toolchain, the pinned data stamps
    # or the gate's own definition moved.
    #
    # `versions.ts` and `psl-provenance.ts` are in here because a `tldts`/`tr46`
    # pin bump is a DATA change (see CONTRIBUTING.md): it can redraw a
    # registrable-domain boundary, and it is exactly the case where a clean
    # resolve on a stock image is worth more than a local run against a warm
    # node_modules that may still hold the old package.
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pnpm-lock.yaml
        - package.json
        - packages/*/package.json
        - .node-version
        - .gitlab-ci.yml
        - tools/verify.sh
        - packages/core/src/data/versions.ts
        - packages/core/src/data/psl-provenance.ts
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - package.json
        - packages/*/package.json
        - .node-version
        - .gitlab-ci.yml
        - tools/verify.sh
        - packages/core/src/data/versions.ts
        - packages/core/src/data/psl-provenance.ts
    # No other pipeline is created. Ordinary code pushes are gated by the
    # pre-push hook; see docs/local-workflow.md ("Hooks").

verify:
  stage: verify
  # NO `rules`, ON PURPOSE. `verify` is in every pipeline this file creates, and
  # that is the whole safety property it carries: `publish` stands behind it by
  # stage ordering, and stage ordering only guarantees anything while `verify`
  # is actually IN the pipeline — a job that was never selected is not a job
  # that passed. A tag pipeline therefore always runs both matrix legs before
  # `publish`, which mints an npm OIDC token and pushes packages to a registry
  # that does not take them back. Do not add a rule that can deselect this job;
  # if one is ever needed, put an unconditional `$CI_COMMIT_TAG` arm first.
  #
  # Node majors, kept in sync with MATRIX in tools/verify.sh. 24 is the floor
  # declared by `engines.node` in every package and pinned in `.node-version`;
  # 26 is the current release line, and `engines` has no upper bound, so users
  # install on it. Nothing is known to differ between them (LINK-wpaieeen
  # measured the gate byte-identical on both) — the matrix exists to keep it
  # that way, not to chase a known break.
  parallel:
    matrix:
      - NODE_MAJOR: ["24", "26"]
  image: node:${NODE_MAJOR}
  interruptible: true
  # A green run is ~2 minutes; anything past 15 is hung, and a hung job on a
  # metered runner bills until it is killed.
  timeout: 15m
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    # Install the pinned pnpm rather than relying on corepack, which is bundled
    # on some Node majors and not others — reading `packageManager` keeps the
    # version in one place (package.json) across both legs.
    - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
    - pnpm config set store-dir "$PNPM_STORE"
    # `jq`, which the `node:` images do not ship (LINK-yzipjdtq). 25 tests in
    # `tests/unit/enforcement-scripts.test.ts` gate themselves on `command -v jq`
    # and they are the ENTIRE behavioural contract of
    # `enforcement/claude-code-hook.sh` — stdin handling, verdict delegation,
    # argument construction, and the run against the real CLI. Skipped here and
    # run on a workstation only, they were the one thing this matrix was supposed
    # to buy and did not. With jq present the file should report a single skip:
    # the darwin-only bash-3.2 pin, which cannot run on Linux by design.
    #
    # A pinned static binary rather than `apt-get install jq`, for three measured
    # reasons. Fetching apt's package indexes is the expensive half and it is
    # unpredictable (3s on bookworm, 79s on trixie in one sample) against ~2.2MB
    # for the binary. Debian's jq is whatever the suite carries, so the two legs
    # would quietly run different jq majors — 1.6 on node:24/bookworm, 1.7 on
    # node:26/trixie — and the matrix would stop varying one thing. And a
    # checksummed download is a pin in the sense the rest of this repo uses the
    # word: upstream moving the artifact fails loudly instead of moving a test
    # result. `verify` only; `publish` runs no tests and gets none of this.
    #
    # Shared runners are amd64; the arm64 arm exists because the SaaS arm64
    # runners do, and because it is the arch this block was exercised on.
    - |
      JQ_VERSION=1.8.2
      case "$(uname -m)" in
        x86_64)  JQ_ARCH=amd64; JQ_SHA256=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f ;;
        aarch64) JQ_ARCH=arm64; JQ_SHA256=8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309 ;;
        *) echo "no pinned jq for $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o /usr/local/bin/jq "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-${JQ_ARCH}"
      echo "${JQ_SHA256}  /usr/local/bin/jq" | sha256sum -c -
      chmod +x /usr/local/bin/jq
    # `mksh`, a SECOND POSIX shell (LINK-znjdpezx). `POSIX_SHELLS` in
    # `tests/unit/enforcement-scripts.test.ts` is built by probing, and on a
    # stock `node:` image it finds exactly one interpreter: `/bin/ksh` is a
    # dangling name, no ksh or mksh is installed, and `/bin/sh` realpaths onto
    # `/bin/dash`. Three `it.each` blocks therefore ran nine cases on the
    # author's machine and three here — and NOTHING SAID SO. This is not a skip:
    # no skipped count moves, no line of the report changes, the file simply
    # reports 100 tests against 106 and both are green. Strictly worse than the
    # jq case above, where the lost coverage at least printed as `skipped`.
    #
    # What that cost is not incidental. `install-aliases.sh`'s `*)` branch routes
    # every non-bash, non-zsh shell to `~/.profile`, and LINK-dwapcooy exists
    # because the guard it emits declared `local` — which dash carries as an
    # extension and ksh93 does not, so a dash-only check called a 126 fine. The
    # one shell CI had was the forgiving one.
    #
    # APT HERE, A PINNED DOWNLOAD FOR jq ABOVE. The three reasons in that block
    # split rather than transfer, and it is worth being explicit about which:
    #
    #   - Pinning does not transfer, because there is nothing to pin. jq's
    #     upstream publishes an immutable, permanently hosted release binary;
    #     MirBSD ships mksh as source, and Debian's pool drops a .deb as soon as
    #     a revision supersedes it, so a checksummed URL here would be a link
    #     that 404s on someone else's schedule. apt is not the lazier route, it
    #     is the only one.
    #   - Determinism across the matrix does not transfer either, and that is
    #     what chose mksh over ksh93. Debian carries mksh R59c in BOTH suites
    #     (59c-28+deb12u1 on bookworm, 59c-41+b2 on trixie): one upstream
    #     release, a packaging revision apart. `apt-get install ksh` would have
    #     put ksh93u+m 2023-01-28 on the node:24 leg and 1.0.10 on the node:26
    #     leg — two shells wearing one name, which is the thing the jq note
    #     refused.
    #   - Cost is the reason that stands, and it is simply paid. Fetching apt's
    #     indexes is the expensive half: 1-2s in six of seven `docker run`
    #     samples taken for this change, and 156s in the seventh. Unpredictable
    #     in both directions, which is what the jq note found from the other end
    #     (3s bookworm, 79s trixie). The lists are deleted afterwards so nothing
    #     downstream inherits a stale index.
    #
    # mksh is a genuinely different implementation, which is the whole point:
    # dash descends from the Almquist shell and mksh from pdksh by way of
    # OpenBSD's ksh. A second ash build would have added a row, not a check.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends mksh
    - rm -rf /var/lib/apt/lists/*
  script:
    # `jq --version` next to `node -v`, because "which jq ran" is the first
    # question any difference between these legs and a workstation would raise.
    # `$KSH_VERSION` for the same reason, and for one more: Debian's mksh package
    # registers the `ksh` alternative, so the POSIX cases in the enforcement
    # suite name themselves `/bin/ksh` in this log while being mksh, not the
    # ksh93 that name means on macOS. This line is what tells them apart.
    - node -v && jq --version && mksh -c 'echo "$KSH_VERSION"'
    - pnpm install --frozen-lockfile
    # `pnpm check` directly, not `tools/verify.sh`: the script's job is to walk
    # the matrix on one machine, and here the matrix is `parallel:matrix`, one
    # Node per job. Running the script would re-run both majors inside each leg.
    - pnpm check

# ---------------------------------------------------------------------------
# Release (LINK-geygvedm, reworked to OIDC under LINK-vbemsjwk).
#
# This is the one job that sends something outside this machine, and it runs
# only on a tag — the `$CI_COMMIT_TAG` arm in `workflow:rules` above already
# admitted that case before this job existed.
#
# NO TOKEN. Authentication is npm "trusted publishing": GitLab mints a
# short-lived OIDC token, the npm CLI exchanges it for a publish token that
# lives for minutes, and npm attaches a provenance attestation for free. There
# is no long-lived credential in this project's CI variables to leak, rotate, or
# expose through world-readable job logs — which matters more here than it would
# on a private project, since `public_jobs` is on. `cc-cream` publishes this way
# already; this is the same shape.
#
# THIS FILE'S PATH IS LOAD-BEARING. npm's trusted-publisher record pins the
# namespace, the project and the "top-level CI file path". Renaming or moving
# `.gitlab-ci.yml` breaks publishing until the record is updated, and the record
# cannot be edited — npm's UI says the provider and its fields are fixed once
# created, so a change means deleting the connection and making a new one.
#
# SHARED RUNNERS ONLY. npm does not accept OIDC from self-hosted runners, so the
# escape hatch discussed for the metered-minutes problem (LINK-ozgkfjow) would
# cost this job its authentication. Weigh that before attaching one.
#
# WHY `npm publish` AND NOT `pnpm publish`. pnpm is the workspace tool here, but
# it is not the publisher: OIDC support is an open request against pnpm
# (pnpm/pnpm#9812), and pnpm 11 — the major pinned in `packageManager` — is
# reported to fail OIDC publishes that worked on pnpm 10 (pnpm/pnpm#11513). The
# npm CLI owns the token exchange, so npm does the publishing.
#
# That leaves one thing only pnpm can do: `workspace:*`. npm would publish that
# literal string and break every install. So pnpm PACKS — which rewrites each
# `workspace:*` to the exact version, measured in `check-release-version.mjs` —
# and npm publishes the resulting tarballs. Each tool does the half it is good
# at, and the artifact npm uploads is the one pnpm resolved.
#
# STATUS, 2026-09-23: unverified end-to-end — no tag has ever been pushed.
# `verify` is NOT red on the tree: LINK-ujbttpph was fixed in 7ecba8b, pipeline
# 2822716357 on `main` put both matrix legs green on 2026-09-05, and the last
# pipeline to run jobs at all (2824077211, 2026-09-06) was green. What blocks a
# tag now is runner minutes again: all nine pipelines created on 2026-09-23,
# `main`'s 2874608846 among them, failed with `ci_quota_exceeded` and no job
# started. A tag pushed while that holds would fail `verify` the same way, and
# stage ordering keeps `publish` from running — nothing reaches the registry.
# Its first execution is also its first test: read the log, and check the
# registry rather than the pipeline's colour.
publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  image: node:24
  interruptible: false
  timeout: 15m
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
    policy: pull
  variables:
    RELEASE_DIR: "$CI_PROJECT_DIR/.release"
  before_script:
    # The node:24 image ships an npm older than trusted publishing needs (11.5.1
    # or later). Pin the major rather than `@latest`, so a future npm major
    # cannot change publish behavior underneath a release.
    - npm install -g npm@11
    - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
    - pnpm config set store-dir "$PNPM_STORE"
  script:
    - node -v && npm -v && pnpm -v
    - pnpm install --frozen-lockfile
    # The tag names the release, and every manifest must agree with it, because
    # the pack step below turns each `workspace:*` into whatever version it finds.
    - node tools/check-release-version.mjs "$CI_COMMIT_TAG"
    - pnpm build
    - mkdir -p "$RELEASE_DIR"
    - pnpm -r --filter "./packages/*" pack --pack-destination "$RELEASE_DIR"
    - ls -l "$RELEASE_DIR"
    # `linklint` (packages/core) goes first: the other three depend on it, and
    # publishing a dependent before its dependency leaves a window in which an
    # install resolves to nothing. Republishing an existing version fails the
    # job, which is the wanted behavior — do not soften it with `|| true`.
    - npm publish "$RELEASE_DIR/linklint-${CI_COMMIT_TAG#v}.tgz"
    # The three scoped packages publish ONLY IF THEIR NAME ALREADY EXISTS on the
    # registry (LINK-kaiehaha). OIDC cannot create a package: the trusted-publisher
    # record needs a package to attach to, so a new name needs the maintainer's
    # bootstrap publish first (CONTRIBUTING.md, "Why CI publishes and you
    # cannot"). Until that has happened, `npm publish` of such a name can only
    # fail — and failing here would take down a release of `linklint` that has
    # already gone out, for a package nobody can install yet anyway. So a name
    # the registry answers with a clean E404 is skipped, loudly, by name.
    #
    # ONLY a clean E404 skips. Any other failure to ask — network, 5xx, auth —
    # fails the job: "could not ask" must never read as "does not exist", or an
    # outage would silently drop a package that is live. And a name that DOES
    # exist keeps the rule above: republishing an existing version fails the job.
    - |
      for tarball in "$RELEASE_DIR"/linklint-cli-*.tgz "$RELEASE_DIR"/linklint-mcp-*.tgz "$RELEASE_DIR"/linklint-online-*.tgz; do
        name="$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
        view_err="$(mktemp)"
        if npm view "$name" name >/dev/null 2>"$view_err"; then
          echo "publishing $tarball ($name)"
          npm publish "$tarball"
        elif grep -Eq 'code E404$' "$view_err"; then
          echo "SKIPPED $name: not on the registry yet (E404) — needs the maintainer's bootstrap publish and trusted-publisher record before CI can publish it"
        else
          cat "$view_err" >&2
          echo "could not ask the registry whether $name exists; refusing to guess" >&2
          exit 1
        fi
      done
